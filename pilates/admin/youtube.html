<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 관리 | 필라테스 관리자</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="admin-shell">
  <div id="sidebar-mount"></div>

  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>유튜브</h1>
        <p>유튜브 페이지에 표시할 영상을 관리합니다</p>
      </div>
      <div class="page-head-actions">
        <button class="btn-purple" id="add-btn">+ 영상 추가</button>
      </div>
    </div>

    <div class="card">
      <table class="list-table">
        <thead>
          <tr>
            <th style="width:60px;">순서</th>
            <th>제목</th>
            <th style="width:160px;">YouTube ID</th>
            <th style="width:140px; text-align:right;">관리</th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="4"><div class="loading-wrap"><div class="loader"></div></div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="card hidden" id="form-card">
      <div class="card-title" id="form-title">영상 추가</div>
      <form id="form" onsubmit="return false;">
        <input type="hidden" name="id">
        <div class="form-row">
          <label>YouTube 영상 URL 또는 ID *</label>
          <input type="text" name="video_input" required placeholder="https://youtu.be/... 또는 동영상 ID">
          <span class="hint">전체 URL을 붙여넣으면 자동으로 ID만 추출합니다.</span>
        </div>
        <div class="form-row"><label>제목</label><input type="text" name="title" placeholder="초보자를 위한 필라테스 기초"></div>
        <div class="form-row"><label>설명</label><textarea name="description" rows="2"></textarea></div>
        <div class="form-row"><label>표시 순서</label><input type="number" name="display_order" value="0" min="0"></div>
        <div class="form-actions">
          <button type="button" class="btn-ghost" id="cancel-btn">취소</button>
          <button type="button" class="btn-purple" id="save-btn">저장</button>
        </div>
      </form>
    </div>

  </main>
</div>

<script src="admin.js"></script>
<script>
let _center = null;

function extractVideoId(input) {
  if (!input) return null;
  input = input.trim();
  // 이미 ID 같으면 그대로
  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
  // youtu.be/<id>
  let m = input.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/watch?v=<id>
  m = input.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/embed/<id>
  m = input.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/shorts/<id>
  m = input.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  return null;
}

async function load() {
  const { data } = await ADMIN.sb.from('pilates_youtube')
    .select('*').eq('center_id', _center.id)
    .order('display_order', { ascending: true });
  const body = document.getElementById('list-body');
  if (!data || !data.length) {
    body.innerHTML = `<tr><td colspan="4" class="muted text-center" style="padding:40px;">등록된 영상이 없습니다.</td></tr>`;
    return;
  }
  body.innerHTML = data.map(v => `
    <tr>
      <td>${v.display_order}</td>
      <td><b>${ADMIN.esc(v.title || '제목 없음')}</b></td>
      <td><code style="font-size:12px; color:var(--gray);">${ADMIN.esc(v.video_id)}</code></td>
      <td class="actions">
        <button class="icon-btn" data-edit="${v.id}">✏️</button>
        <button class="icon-btn danger" data-del="${v.id}">🗑️</button>
      </td>
    </tr>`).join('');
  body.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(data.find(x => x.id === b.dataset.edit))));
  body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => del(b.dataset.del)));
}

function openAdd() {
  const f = document.getElementById('form');
  f.reset(); f.id.value=''; f.display_order.value=0;
  document.getElementById('form-title').textContent = '영상 추가';
  document.getElementById('form-card').classList.remove('hidden');
  document.getElementById('form-card').scrollIntoView({ behavior:'smooth' });
}
function openEdit(row) {
  const f = document.getElementById('form');
  f.reset();
  f.id.value = row.id;
  f.video_input.value = row.video_id || '';
  f.title.value = row.title || '';
  f.description.value = row.description || '';
  f.display_order.value = row.display_order ?? 0;
  document.getElementById('form-title').textContent = '영상 수정';
  document.getElementById('form-card').classList.remove('hidden');
  document.getElementById('form-card').scrollIntoView({ behavior:'smooth' });
}
async function save() {
  const f = document.getElementById('form');
  const vid = extractVideoId(f.video_input.value);
  if (!vid) return ADMIN.toast('유효한 YouTube ID를 입력하세요.', 'error');
  const payload = {
    center_id: _center.id,
    video_id: vid,
    title: f.title.value.trim() || null,
    description: f.description.value.trim() || null,
    display_order: parseInt(f.display_order.value, 10) || 0,
  };
  const id = f.id.value;
  const { error } = id
    ? await ADMIN.sb.from('pilates_youtube').update(payload).eq('id', id)
    : await ADMIN.sb.from('pilates_youtube').insert(payload);
  if (error) return ADMIN.toast('저장 실패: ' + error.message, 'error');
  ADMIN.toast('저장되었습니다');
  document.getElementById('form-card').classList.add('hidden');
  load();
}
async function del(id) {
  if (!ADMIN.confirmAction('삭제하시겠습니까?')) return;
  const { error } = await ADMIN.sb.from('pilates_youtube').delete().eq('id', id);
  if (error) return ADMIN.toast('삭제 실패: ' + error.message, 'error');
  ADMIN.toast('삭제되었습니다');
  load();
}

ADMIN.bootAdmin('youtube.html', async ({ center }) => {
  _center = center;
  document.getElementById('add-btn').addEventListener('click', openAdd);
  document.getElementById('save-btn').addEventListener('click', save);
  document.getElementById('cancel-btn').addEventListener('click', () =>
    document.getElementById('form-card').classList.add('hidden'));
  await load();
});
</script>
</body>
</html>
