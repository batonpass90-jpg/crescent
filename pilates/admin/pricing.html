<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가격 관리 | 필라테스 관리자</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="admin-shell">
  <div id="sidebar-mount"></div>

  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>가격</h1>
        <p>시간표 페이지 하단에 표시되는 패키지 가격을 관리합니다</p>
      </div>
      <div class="page-head-actions">
        <button class="btn-purple" id="add-btn">+ 가격 추가</button>
      </div>
    </div>

    <div class="card">
      <table class="list-table">
        <thead>
          <tr>
            <th style="width:60px;">순서</th>
            <th>패키지명</th>
            <th>가격</th>
            <th>강조</th>
            <th style="width:140px; text-align:right;">관리</th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="5"><div class="loading-wrap"><div class="loader"></div></div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="card hidden" id="form-card">
      <div class="card-title" id="form-title">가격 추가</div>
      <form id="form" onsubmit="return false;">
        <input type="hidden" name="id">
        <div class="form-row"><label>패키지명 *</label><input type="text" name="name" required placeholder="1:1 10회권"></div>
        <div class="form-grid-2">
          <div class="form-row"><label>금액 *</label><input type="text" name="amount" required placeholder="300,000"></div>
          <div class="form-row"><label>단위</label><input type="text" name="unit" value="원"></div>
        </div>
        <div class="form-row">
          <label>혜택 (한 줄에 하나씩)</label>
          <textarea name="features" rows="4" placeholder="1회 50분&#10;3개월 유효&#10;체형 분석 1회 무료"></textarea>
        </div>
        <div class="form-grid-2">
          <div class="form-row">
            <label>강조 (BEST 카드)</label>
            <div class="toggle-row"><input type="checkbox" name="featured"> <span>이 카드 강조하기</span></div>
          </div>
          <div class="form-row"><label>뱃지 텍스트</label><input type="text" name="badge" placeholder="BEST"></div>
        </div>
        <div class="form-row"><label>표시 순서</label><input type="number" name="display_order" value="0" min="0"></div>
        <div class="form-actions">
          <button type="button" class="btn-ghost" id="cancel-btn">취소</button>
          <button type="button" class="btn-purple" id="save-btn">저장</button>
        </div>
      </form>
    </div>

  </main>
</div>

<script src="admin.js"></script>
<script>
let _center = null;

async function load() {
  const { data } = await ADMIN.sb.from('pilates_pricing')
    .select('*').eq('center_id', _center.id)
    .order('display_order', { ascending: true });
  const body = document.getElementById('list-body');
  if (!data || !data.length) {
    body.innerHTML = `<tr><td colspan="5" class="muted text-center" style="padding:40px;">등록된 가격이 없습니다.</td></tr>`;
    return;
  }
  body.innerHTML = data.map(p => `
    <tr>
      <td>${p.display_order}</td>
      <td><b>${ADMIN.esc(p.name)}</b></td>
      <td>${ADMIN.esc(p.amount)}${ADMIN.esc(p.unit || '원')}</td>
      <td>${p.featured ? `<span class="tag-pill featured-pill">${ADMIN.esc(p.badge || 'BEST')}</span>` : '-'}</td>
      <td class="actions">
        <button class="icon-btn" data-edit="${p.id}">✏️</button>
        <button class="icon-btn danger" data-del="${p.id}">🗑️</button>
      </td>
    </tr>`).join('');
  body.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(data.find(x => x.id === b.dataset.edit))));
  body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => del(b.dataset.del)));
}

function openAdd() {
  const f = document.getElementById('form');
  f.reset(); f.id.value=''; f.unit.value='원'; f.display_order.value=0;
  document.getElementById('form-title').textContent = '가격 추가';
  document.getElementById('form-card').classList.remove('hidden');
  document.getElementById('form-card').scrollIntoView({ behavior:'smooth' });
}
function openEdit(row) {
  const f = document.getElementById('form');
  f.reset();
  f.id.value = row.id;
  f.name.value = row.name || '';
  f.amount.value = row.amount || '';
  f.unit.value = row.unit || '원';
  f.features.value = (row.features || []).join('\n');
  f.featured.checked = !!row.featured;
  f.badge.value = row.badge || '';
  f.display_order.value = row.display_order ?? 0;
  document.getElementById('form-title').textContent = '가격 수정';
  document.getElementById('form-card').classList.remove('hidden');
  document.getElementById('form-card').scrollIntoView({ behavior:'smooth' });
}
async function save() {
  const f = document.getElementById('form');
  if (!f.name.value.trim() || !f.amount.value.trim()) return ADMIN.toast('이름과 금액은 필수입니다.', 'error');
  const features = f.features.value.split('\n').map(s => s.trim()).filter(Boolean);
  const payload = {
    center_id: _center.id,
    name: f.name.value.trim(),
    amount: f.amount.value.trim(),
    unit: f.unit.value.trim() || '원',
    features,
    featured: f.featured.checked,
    badge: f.badge.value.trim() || null,
    display_order: parseInt(f.display_order.value, 10) || 0,
  };
  const id = f.id.value;
  const { error } = id
    ? await ADMIN.sb.from('pilates_pricing').update(payload).eq('id', id)
    : await ADMIN.sb.from('pilates_pricing').insert(payload);
  if (error) return ADMIN.toast('저장 실패: ' + error.message, 'error');
  ADMIN.toast('저장되었습니다');
  document.getElementById('form-card').classList.add('hidden');
  load();
}
async function del(id) {
  if (!ADMIN.confirmAction('삭제하시겠습니까?')) return;
  const { error } = await ADMIN.sb.from('pilates_pricing').delete().eq('id', id);
  if (error) return ADMIN.toast('삭제 실패: ' + error.message, 'error');
  ADMIN.toast('삭제되었습니다');
  load();
}

ADMIN.bootAdmin('pricing.html', async ({ center }) => {
  _center = center;
  document.getElementById('add-btn').addEventListener('click', openAdd);
  document.getElementById('save-btn').addEventListener('click', save);
  document.getElementById('cancel-btn').addEventListener('click', () =>
    document.getElementById('form-card').classList.add('hidden'));
  await load();
});
</script>
</body>
</html>
