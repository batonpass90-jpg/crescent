<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 | 필라테스</title>
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 28px;
}
.video-card {
  background: white;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1.5px solid var(--border);
  transition: box-shadow 0.2s, transform 0.2s;
}
.video-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-4px);
}
.video-frame {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #000;
}
.video-frame iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.video-body { padding: 22px 24px 26px; }
.video-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--dark);
  margin-bottom: 8px;
  letter-spacing: -0.4px;
}
.video-desc {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.7;
}
</style>
</head>
<body>

<div class="top-banner">로딩 중…</div>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">스튜디오 <span>필라테스</span></a>
    <ul class="nav-links">
      <li><a href="index.html">홈</a></li>
      <li><a href="instructor.html">강사</a></li>
      <li><a href="schedule.html">시간표</a></li>
      <li><a href="youtube.html" class="active">유튜브</a></li>
      <li><a href="location.html">오시는 길</a></li>
    </ul>
    <a href="#" data-tel class="nav-cta">무료체험</a>
  </div>
</nav>

<main>
  <section class="page-wrap">
    <div class="section-header">
      <div class="section-label">YOUTUBE</div>
      <div class="section-title">집에서 따라하는 영상</div>
      <div class="section-desc">강사가 직접 촬영한 운동 영상으로 미리 체험해 보세요</div>
    </div>

    <div class="video-grid" id="video-grid">
      <div class="loading-wrap" style="grid-column:1/-1"><div class="loader"></div></div>
    </div>
  </section>

  <section class="cta-banner">
    <div class="cta-inner">
      <h2>영상만으론 부족하다면?</h2>
      <p>전문 강사와 함께 1:1 맞춤 수업을 받아보세요</p>
      <a href="#" data-tel class="btn-white btn-lg">무료 체험 신청</a>
    </div>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <div data-footer-info></div>
    <div class="footer-links">
      <div class="footer-col">
        <h4>수업</h4>
        <a href="schedule.html">시간표</a>
      </div>
      <div class="footer-col">
        <h4>안내</h4>
        <a href="instructor.html">강사</a>
        <a href="location.html">오시는 길</a>
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    Powered by Studio Core Template · <a href="admin/login.html">원장님 로그인</a>
  </div>
</footer>

<a href="#" class="kakao-float" target="_blank" rel="noopener">💬</a>

<script src="app.js"></script>
<script>
PILATES.bootPage(async (center) => {
  const { data: videos } = await PILATES.sb
    .from('pilates_youtube')
    .select('*')
    .eq('center_id', center.id)
    .order('display_order', { ascending: true });

  document.getElementById('video-grid').innerHTML = (videos || []).length
    ? videos.map(v => `
        <div class="video-card">
          <div class="video-frame">
            <iframe
              src="https://www.youtube.com/embed/${PILATES.esc(v.video_id)}"
              title="${PILATES.esc(v.title || '')}"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          <div class="video-body">
            <div class="video-title">${PILATES.esc(v.title || '제목 없음')}</div>
            ${v.description ? `<div class="video-desc">${PILATES.nl2br(v.description)}</div>` : ''}
          </div>
        </div>`).join('')
    : `<div class="muted text-center" style="padding:60px; grid-column:1/-1;">등록된 영상이 없습니다.</div>`;
});
</script>
</body>
</html>
